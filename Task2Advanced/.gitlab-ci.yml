# Альтернатива GitHub Actions — GitLab CI/CD с тем же пайплайном
# Скопируйте в корень репозитория или настройте include из Task2Advanced

stages:
  - validate
  - plan
  - apply

variables:
  TF_ROOT: Task2Advanced
  TF_STATE_BUCKET: budushee-terraform-state
  TF_STATE_ENDPOINT: http://minio:9000
  TF_STATE_REGION: us-east-1
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin

.terraform_base:
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  before_script:
    - cd "${CI_PROJECT_DIR}/${TF_ROOT}"

validate:
  extends: .terraform_base
  stage: validate
  parallel:
    matrix:
      - ENVIRONMENT: [dev, stage, prod]
  script:
    - terraform fmt -check -recursive
    - cd "envs/${ENVIRONMENT}"
    - terraform init -backend=false -input=false
    - terraform validate

remote_state:
  extends: .terraform_base
  stage: validate
  services:
    - name: minio/minio:RELEASE.2024-12-18T13-15-44Z
      alias: minio
      command: ["server", "/data"]
      variables:
        MINIO_ROOT_USER: minioadmin
        MINIO_ROOT_PASSWORD: minioadmin
  parallel:
    matrix:
      - ENVIRONMENT: [dev, stage, prod]
  script:
    - apk add --no-cache curl docker-cli || true
    - export TF_STATE_KEY="envs/${ENVIRONMENT}/terraform.tfstate"
    - ./scripts/generate-backend-config.sh "${ENVIRONMENT}" "envs/${ENVIRONMENT}/backend.ci.hcl"
    - cd "envs/${ENVIRONMENT}"
    - terraform init -backend-config=backend.ci.hcl -input=false -reconfigure
    - test ! -f terraform.tfstate

plan:
  extends: .terraform_base
  stage: plan
  needs: [validate, remote_state]
  parallel:
    matrix:
      - ENVIRONMENT: [dev, stage, prod]
  script:
    - export TF_STATE_KEY="envs/${ENVIRONMENT}/terraform.tfstate"
    - ./scripts/generate-backend-config.sh "${ENVIRONMENT}" "envs/${ENVIRONMENT}/backend.ci.hcl"
    - cd "envs/${ENVIRONMENT}"
    - terraform init -backend-config=backend.ci.hcl -input=false -reconfigure
    - terraform plan -var-file=terraform.tfvars -out=tfplan
  artifacts:
    paths:
      - "${TF_ROOT}/envs/${ENVIRONMENT}/tfplan"
    expire_in: 5 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

apply:
  extends: .terraform_base
  stage: apply
  script:
    - export TF_STATE_KEY="envs/${APPLY_ENV}/terraform.tfstate"
    - ./scripts/generate-backend-config.sh "${APPLY_ENV}" "envs/${APPLY_ENV}/backend.ci.hcl"
    - cd "envs/${APPLY_ENV}"
    - terraform init -backend-config=backend.ci.hcl -input=false -reconfigure
    - terraform plan -var-file=terraform.tfvars -out=tfplan
    - terraform apply -auto-approve tfplan
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
  environment:
    name: $APPLY_ENV
